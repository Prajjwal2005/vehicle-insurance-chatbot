<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vehicle Insurance Assistant</title>
<style>
:root{
  --teal:#0d9488; --teal-dark:#0f766e; --teal-soft:#ccfbf1;
  --bg:#eef2f4; --panel:#ffffff; --bot:#ffffff; --bot-border:#e5e7eb;
  --text:#1f2937; --muted:#6b7280; --err:#b91c1c; --err-bg:#fef2f2;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--text); display:flex; justify-content:center;
}
.app{
  width:100%; max-width:740px; height:100dvh; background:var(--panel);
  display:flex; flex-direction:column; box-shadow:0 0 40px rgba(0,0,0,.08);
}
.header{
  background:linear-gradient(135deg,var(--teal),var(--teal-dark));
  color:#fff; padding:18px 22px; display:flex; align-items:center; gap:14px;
}
.header svg{width:32px;height:32px;flex:none}
.header h1{font-size:18px;font-weight:650;letter-spacing:.2px}
.header .sub{font-size:13px;opacity:.85;margin-top:2px}
.header .newchat{
  margin-left:auto; border:1px solid rgba(255,255,255,.55); background:rgba(255,255,255,.12);
  color:#fff; font:inherit; font-size:13px; font-weight:600; padding:7px 14px;
  border-radius:9px; cursor:pointer; white-space:nowrap; transition:background .15s;
}
.header .newchat:hover{background:rgba(255,255,255,.24)}
.messages{
  flex:1; overflow-y:auto; padding:22px; display:flex; flex-direction:column;
  gap:12px; background:#f7f9fa;
}
.message{
  max-width:78%; padding:11px 15px; border-radius:16px; line-height:1.5;
  font-size:15px; white-space:pre-wrap; word-wrap:break-word; animation:pop .18s ease;
}
.message.user{align-self:flex-end; background:var(--teal); color:#fff; border-bottom-right-radius:5px}
.message.bot{align-self:flex-start; background:var(--bot); border:1px solid var(--bot-border); border-bottom-left-radius:5px}
.message.error{align-self:flex-start; background:var(--err-bg); border:1px solid #fecaca; color:var(--err)}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.widget{align-self:flex-start; max-width:88%; display:flex; flex-direction:column; gap:8px; animation:pop .18s ease}
.plan{background:#fff; border:1px solid var(--bot-border); border-left:4px solid var(--teal); border-radius:12px; padding:12px 14px}
.plan .name{font-weight:650; font-size:15px}
.plan .price{color:var(--teal-dark); font-weight:600; font-size:14px; margin:2px 0 6px}
.plan ul{margin:0; padding-left:18px; color:var(--muted); font-size:13px; line-height:1.55}
.receipt{background:#ecfdf5; border:1px solid #a7f3d0; border-radius:12px; padding:14px 16px}
.receipt .label{font-size:13px; color:var(--teal-dark); font-weight:600}
.receipt .number{font-size:19px; font-weight:700; letter-spacing:.5px; margin-top:3px; color:var(--text)}
.badge{display:inline-flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--bot-border); border-radius:999px; padding:8px 14px; font-size:14px; align-self:flex-start}
.badge .pill{padding:2px 10px; border-radius:999px; font-size:12px; font-weight:700; text-transform:capitalize}
.pill.submitted{background:#dbeafe; color:#1d4ed8}
.pill.approved{background:#dcfce7; color:#15803d}
.pill.declined{background:#fee2e2; color:#b91c1c}
.pill.completed{background:#e0e7ff; color:#4338ca}
.pill.draft{background:#f3f4f6; color:#6b7280}
.typing{padding:0 22px 8px; display:flex; gap:5px; align-items:center; height:20px}
.typing.hidden{display:none}
.typing span{width:8px;height:8px;border-radius:50%;background:#9ca3af;animation:blink 1.2s infinite both}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
.composer{display:flex; gap:10px; padding:14px 16px; border-top:1px solid #e5e7eb; background:#fff}
.composer textarea{
  flex:1; resize:none; border:1px solid #d1d5db; border-radius:12px; padding:11px 14px;
  font:inherit; font-size:15px; max-height:120px; outline:none;
}
.composer textarea:focus{border-color:var(--teal); box-shadow:0 0 0 3px var(--teal-soft)}
.composer button{
  border:none; background:var(--teal); color:#fff; font:inherit; font-weight:600;
  padding:0 22px; border-radius:12px; cursor:pointer; transition:background .15s;
}
.composer button:hover{background:var(--teal-dark)}
.composer button:disabled{background:#9ca3af; cursor:not-allowed}
.composer button.mic{background:#6b7280; margin-right:8px; padding:0 16px; font-size: 18px;}
.composer button.mic:hover{background:#4b5563;}
.composer button.mic.listening{background:var(--err); animation:pulse 1.5s infinite;}
@keyframes pulse{0%{opacity:1}50%{opacity:.6}100%{opacity:1}}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
    <div>
      <h1>Vehicle Insurance Assistant</h1>
      <div class="sub">Apply for insurance, file a claim, or check claim status</div>
    </div>
    <button id="newchat" class="newchat" title="Start a fresh conversation">New chat</button>
  </header>
  <main id="messages" class="messages"></main>
  <div id="typing" class="typing hidden"><span></span><span></span><span></span></div>
  <footer class="composer">
    <textarea id="input" rows="1" placeholder="Type your message..."></textarea>
    <button id="mic" class="mic" title="Click to speak">🎤</button>
    <button id="send">Send</button>
  </footer>
</div>
<script>
(function(){
  var messagesEl = document.getElementById("messages");
  var inputEl = document.getElementById("input");
  var sendBtn = document.getElementById("send");
  var typingEl = document.getElementById("typing");
  var newChatBtn = document.getElementById("newchat");
  var micBtn = document.getElementById("mic");
  var sessionId = null;

  var WELCOME = "Hi! I am your vehicle insurance assistant. I can help you apply for insurance, file a claim, or check the status of a claim. What would you like to do?";
  var EMPTY_FALLBACK = "Sorry, I did not catch that. Could you rephrase or try again?";

  function scrollDown(){ messagesEl.scrollTop = messagesEl.scrollHeight; }

  function el(tag, cls, text){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(text != null) e.textContent = text;
    return e;
  }

  function addMessage(text, who){
    var clean = (text || "").trim();
    if(!clean) return;
    messagesEl.appendChild(el("div", "message " + who, clean));
    scrollDown();
  }

  function renderWidget(w){
    var wrap = el("div", "widget");
    if(w.type === "policies"){
      (w.data.plans || []).forEach(function(plan){
        var card = el("div", "plan");
        card.appendChild(el("div", "name", plan.name));
        if(plan.price != null) card.appendChild(el("div", "price", "$" + plan.price + " / year"));
        if(plan.features && plan.features.length){
          var ul = el("ul");
          plan.features.forEach(function(f){ ul.appendChild(el("li", null, f)); });
          card.appendChild(ul);
        }
        wrap.appendChild(card);
      });
    } else if(w.type === "policy"){
      var rp = el("div", "receipt");
      rp.appendChild(el("div", "label", "Policy issued"));
      rp.appendChild(el("div", "number", w.data.policy_number || ""));
      wrap.appendChild(rp);
    } else if(w.type === "claim"){
      var rc = el("div", "receipt");
      rc.appendChild(el("div", "label", "Claim filed"));
      rc.appendChild(el("div", "number", w.data.claim_number || ""));
      wrap.appendChild(rc);
    } else if(w.type === "claim_status"){
      var b = el("div", "badge");
      b.appendChild(el("span", null, w.data.claim_number || "Claim"));
      b.appendChild(el("span", "pill " + String(w.data.status || "").toLowerCase(), w.data.status || ""));
      wrap.appendChild(b);
    } else {
      return;
    }
    messagesEl.appendChild(wrap);
    scrollDown();
  }

  function renderWidgets(widgets){ (widgets || []).forEach(renderWidget); }

  function setBusy(busy){
    inputEl.disabled = busy;
    sendBtn.disabled = busy;
    typingEl.classList.toggle("hidden", !busy);
    if(busy) scrollDown();
  }

  function autosize(){
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
  }

  function resetChat(){
    sessionId = null;
    messagesEl.innerHTML = "";
    addMessage(WELCOME, "bot");
    inputEl.value = "";
    autosize();
    inputEl.focus();
    if (window.speechSynthesis) window.speechSynthesis.cancel();
  }

  var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  var recognition = SpeechRecognition ? new SpeechRecognition() : null;
  var synth = window.speechSynthesis;
  var isListening = false;

  if(recognition){
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = "en-US";
    recognition.onstart = function(){
      isListening = true;
      micBtn.classList.add("listening");
      inputEl.placeholder = "Listening...";
    };
    recognition.onresult = function(event){
      var transcript = event.results[0][0].transcript;
      inputEl.value = transcript;
      autosize();
      send();
    };
    recognition.onerror = function(event){
      console.error("Speech recognition error", event.error);
      stopListening();
    };
    recognition.onend = function(){
      stopListening();
    };
  } else {
    if (micBtn) micBtn.style.display = "none";
  }

  function stopListening(){
    isListening = false;
    if (micBtn) micBtn.classList.remove("listening");
    inputEl.placeholder = "Type your message...";
  }

  if (micBtn) {
    micBtn.addEventListener("click", function(){
      if(!recognition) return;
      if(isListening){
        recognition.stop();
      } else {
        recognition.start();
      }
    });
  }

  function speakText(text) {
    if(!synth) return;
    synth.cancel();
    var utterance = new SpeechSynthesisUtterance(text);
    synth.speak(utterance);
  }

  async function send(){
    var text = inputEl.value.trim();
    if(!text) return;
    addMessage(text, "user");
    inputEl.value = "";
    autosize();
    setBusy(true);
    try{
      var res = await fetch("/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ session_id: sessionId, message: text })
      });
      if(!res.ok){
        var detail = "Something went wrong. Please try again.";
        try{ var e = await res.json(); if(e && e.detail) detail = e.detail; }catch(_){}
        addMessage(detail, "error");
      } else {
        var data = await res.json();
        sessionId = data.session_id;
        var replyText = (data.reply || "").trim() || EMPTY_FALLBACK;
        addMessage(replyText, "bot");
        renderWidgets(data.widgets);
        speakText(replyText);
      }
    } catch(err){
      addMessage("Could not reach the server. Make sure the chatbot is running.", "error");
    } finally {
      setBusy(false);
      inputEl.focus();
    }
  }

  inputEl.addEventListener("input", autosize);
  inputEl.addEventListener("keydown", function(e){
    if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); }
  });
  sendBtn.addEventListener("click", send);
  newChatBtn.addEventListener("click", resetChat);

  addMessage(WELCOME, "bot");
  inputEl.focus();
})();
</script>
</body>
</html>
